# Link checker settings, shared by `npm run check:links` and CI.
# Inputs and --root-dir are passed on the command line: root-dir must be
# absolute, so it cannot be committed here.

no_progress = true

# Nothing in the built site should point at a private or local address.
exclude_all_private = true

exclude = [
  # The 404 page's own canonical URL returns 404 by design.
  "docs\\.termly\\.io/404",
  # The Intercom-hosted help centre serves 403 to datacenter IPs, so these
  # resolve fine in a browser but always fail from a CI runner.
  "support\\.termly\\.io",
]

# 206 for range responses, 429 for hosts that rate-limit our checker.
accept = ["200", "206", "429"]

# External hosts occasionally drop a connection. Defaults are 3 retries and a
# 20s timeout, which still flaked in practice; a failed run is safe to re-run.
max_retries = 5
timeout = 30
